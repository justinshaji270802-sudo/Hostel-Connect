
{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Hostel Connect{% endblock %}

{% block content %}

<style>
.login-page {
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.08), transparent 35%),
        #f5f8fc;
}

.login-wrapper {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

.login-card {
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
    border: 1px solid rgba(226, 232, 240, 0.8);
}

.login-card::before {
    content: "HOSTEL CONNECT\A\A Smart Hostel Management\A\A Manage your hostel life easily, securely and efficiently.";
    white-space: pre-wrap;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px;
    color: #ffffff;
    font-size: 18px;
    line-height: 1.8;
    font-weight: 500;
    background:
        linear-gradient(
            135deg,
            rgba(30, 64, 175, 0.95),
            rgba(14, 116, 144, 0.95)
        ),
        url("{% static 'images/hostel.jpg' %}");
    background-size: cover;
    background-position: center;
}

.login-card > .login-header,
.login-card > form,
.login-card > .login-footer {
    grid-column: 2;
}

.login-header {
    padding: 45px 55px 15px;
    text-align: center;
}

.login-icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: linear-gradient(135deg, #2563eb, #0ea5e9);
    color: #ffffff;
    font-size: 25px;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
}

.login-header h2 {
    margin: 0;
    color: #172033;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.login-header p {
    margin-top: 8px;
    color: #64748b;
    font-size: 14px;
}

.login-form {
    padding: 20px 55px 15px;
}

.login-field {
    margin-bottom: 22px;
}

.login-field label {
    display: block;
    margin-bottom: 8px;
    color: #334155;
    font-size: 14px;
    font-weight: 600;
}

.login-field label i {
    color: #2563eb;
    margin-right: 7px;
}

.login-input-wrapper {
    position: relative;
}

.login-field input {
    width: 100%;
    height: 52px;
    padding: 0 45px 0 16px;
    border: 1px solid #dbe2ea;
    border-radius: 12px;
    background: #f8fafc;
    color: #172033;
    font-size: 14px;
    outline: none;
    transition: all 0.25s ease;
    box-sizing: border-box;
}

.login-field input::placeholder {
    color: #94a3b8;
}

.login-field input:hover {
    border-color: #b9c7d8;
}

.login-field input:focus {
    background: #ffffff;
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #64748b;
    cursor: pointer;
    font-size: 16px;
}

.password-toggle:hover {
    color: #2563eb;
}

.login-button {
    width: 100%;
    height: 52px;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.22);
    transition: all 0.25s ease;
}

.login-button i {
    margin-right: 8px;
}

.login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.30);
}

.home-button {
    width: 100%;
    height: 52px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #dbe2ea;
    border-radius: 12px;
    background: #ffffff;
    color: #475569;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.25s ease;
    box-sizing: border-box;
}

.home-button i {
    margin-right: 8px;
}

.home-button:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    color: #2563eb;
}

.login-footer {
    padding: 15px 55px 40px;
    text-align: center;
}

.login-footer p {
    margin: 0;
    color: #64748b;
    font-size: 14px;
}

.login-footer a {
    color: #2563eb;
    font-weight: 600;
    text-decoration: none;
}

.login-footer a:hover {
    text-decoration: underline;
}

@media (max-width: 800px) {
    .login-card {
        grid-template-columns: 1fr;
    }

    .login-card::before {
        display: none;
    }

    .login-card > .login-header,
    .login-card > form,
    .login-card > .login-footer {
        grid-column: 1;
    }

    .login-header {
        padding: 40px 30px 15px;
    }

    .login-form {
        padding: 20px 30px 15px;
    }

    .login-footer {
        padding: 15px 30px 35px;
    }
}

@media (max-width: 480px) {
    .login-page {
        padding: 30px 15px;
    }

    .login-card {
        border-radius: 18px;
    }

    .login-header h2 {
        font-size: 25px;
    }

    .login-icon {
        width: 58px;
        height: 58px;
        font-size: 22px;
    }

    .login-header {
        padding: 35px 22px 10px;
    }

    .login-form {
        padding: 20px 22px 10px;
    }

    .login-footer {
        padding: 15px 22px 30px;
    }
}
</style>

<section class="auth-section login-page">
    <div class="container">
        <div class="login-wrapper">
            <div class="login-card">

                <div class="login-header">
                    <div class="login-icon">
                        <i class="fas fa-sign-in-alt"></i>
                    </div>

                    <h2>Welcome Back!</h2>
                    <p>Login to your Hostel Connect account</p>
                </div>

                <form method="POST" class="login-form">
                    {% csrf_token %}

                    <div class="login-field">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="login-field">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>

                        <div class="login-input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword()"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye" id="passwordIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary login-button"
                    >
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>

                    <a href="{% url 'home' %}" class="btn btn-secondary home-button">
                        <i class="fas fa-home"></i>
                        Back to Home
                    </a>
                </form>

                <div class="login-footer">
                    <p>
                        Don't have an account?
                        <a href="{% url 'register' %}">Register here</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</section>

<script>
function togglePassword() {
    const passwordInput = document.getElementById("password");
    const passwordIcon = document.getElementById("passwordIcon");
    const toggleButton = document.querySelector(".password-toggle");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        passwordIcon.classList.remove("fa-eye");
        passwordIcon.classList.add("fa-eye-slash");
        toggleButton.setAttribute("aria-label", "Hide password");
    } else {
        passwordInput.type = "password";
        passwordIcon.classList.remove("fa-eye-slash");
        passwordIcon.classList.add("fa-eye");
        toggleButton.setAttribute("aria-label", "Show password");
    }
}
</script>

{% endblock %}
